<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HustleTrack</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 6px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-bottom: 12px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .rate {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }

    .verdict {
      margin-top: 6px;
      color: #94a3b8;
    }

    .offer {
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }

    .offer:last-child {
      border-bottom: none;
    }

    .offer-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .offer-name {
      font-weight: bold;
    }

    .offer-rate {
      font-weight: bold;
      color: #4ade80;
    }

    .progress {
      height: 10px;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      background: #22c55e;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 7px;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 20px 0;
    }

    .danger {
      background: #ef4444;
      color: white;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>💰 HustleTrack</h1>
    <div class="subtitle">Track your side hustles. Know your $/hour.</div>
  </header>

  <div class="stats">

    <div class="card">
      <div class="stat-label">Total Earnings</div>
      <div class="stat-value" id="totalEarnings">$0.00</div>
    </div>

    <div class="card">
      <div class="stat-label">Average $/Hour</div>
      <div class="stat-value" id="averageRate">$0.00</div>
    </div>

  </div>

  <div class="card">

    <h2>⏱️ Is This Worth My Time?</h2>

    <label>
      Reward ($)
      <input id="reward" type="number" min="0" step="0.01" placeholder="90">
    </label>

    <label>
      Hours Required
      <input id="hours" type="number" min="0" step="0.1" placeholder="7">
    </label>

    <div class="rate" id="calculatedRate">$0.00/hr</div>

    <div class="verdict" id="verdict">
      Enter the reward and time.
    </div>

  </div>

  <div class="card">

    <h2>➕ Add Earnings</h2>

    <label>
      Hustle
      <select id="hustle">
        <option>Freecash</option>
        <option>Games</option>
        <option>Plasma</option>
        <option>Cashback</option>
        <option>Reselling</option>
        <option>Other</option>
      </select>
    </label>

    <label>
      Amount Earned ($)
      <input id="amount" type="number" min="0" step="0.01" placeholder="25">
    </label>

    <label>
      Hours Worked
      <input id="workedHours" type="number" min="0" step="0.1" placeholder="2">
    </label>

    <button onclick="addEarning()">Add Earnings</button>

  </div>

  <div class="card">

    <h2>🎮 Active Offers</h2>

    <label>
      Offer Name
      <input id="offerName" placeholder="Reach Level 1000">
    </label>

    <label>
      Reward ($)
      <input id="offerReward" type="number" min="0" step="0.01" placeholder="90">
    </label>

    <label>
      Goal Level
      <input id="goalLevel" type="number" min="1" placeholder="1000">
    </label>

    <label>
      Current Level
      <input id="currentLevel" type="number" min="0" placeholder="265">
    </label>

    <label>
      Estimated Hours Remaining
      <input id="remainingHours" type="number" min="0" step="0.1" placeholder="3">
    </label>

    <button onclick="addOffer()">Track Offer</button>

    <div id="offers" style="margin-top:16px;"></div>

  </div>

  <div class="card">

    <h2>📊 Earnings History</h2>

    <div id="history">
      <div class="empty">No earnings recorded yet.</div>
    </div>

    <button class="danger" onclick="clearData()">
      Clear All Data
    </button>

  </div>

</div>

<script>

let earnings = JSON.parse(localStorage.getItem("hustleEarnings")) || [];
let offers = JSON.parse(localStorage.getItem("hustleOffers")) || [];

function money(number) {
  return "$" + Number(number).toFixed(2);
}

function save() {
  localStorage.setItem("hustleEarnings", JSON.stringify(earnings));
  localStorage.setItem("hustleOffers", JSON.stringify(offers));
}

function updateDashboard() {

  const total = earnings.reduce((sum, item) => {
    return sum + item.amount;
  }, 0);

  const hours = earnings.reduce((sum, item) => {
    return sum + item.hours;
  }, 0);

  const average = hours > 0 ? total / hours : 0;

  document.getElementById("totalEarnings").textContent = money(total);

  document.getElementById("averageRate").textContent =
    money(average) + "/hr";

  renderHistory();
  renderOffers();
}

function calculateRate() {

  const reward = Number(document.getElementById("reward").value) || 0;

  const hours = Number(document.getElementById("hours").value) || 0;

  const rate = hours > 0 ? reward / hours : 0;

  document.getElementById("calculatedRate").textContent =
    money(rate) + "/hr";

  let message = "Enter the reward and time.";

  if (hours > 0 && reward > 0) {

    if (rate >= 25) {
      message = "🔥 Very strong hourly return";
    } else if (rate >= 15) {
      message = "🟢 Solid hourly return";
    } else if (rate >= 10) {
      message = "🟡 Moderate hourly return";
    } else {
      message = "🔴 Low hourly return";
    }

  }

  document.getElementById("verdict").textContent = message;
}

document.getElementById("reward").addEventListener(
  "input",
  calculateRate
);

document.getElementById("hours").addEventListener(
  "input",
  calculateRate
);

function addEarning() {

  const hustle =
    document.getElementById("hustle").value;

  const amount =
    Number(document.getElementById("amount").value);

  const hours =
    Number(document.getElementById("workedHours").value);

  if (!amount || amount <= 0) {
    alert("Enter an amount earned.");
    return;
  }

  earnings.push({
    hustle: hustle,
    amount: amount,
    hours: hours || 0,
    date: new Date().toLocaleDateString()
  });

  save();

  document.getElementById("amount").value = "";
  document.getElementById("workedHours").value = "";

  updateDashboard();
}

function addOffer() {

  const name =
    document.getElementById("offerName").value.trim();

  const reward =
    Number(document.getElementById("offerReward").value);

  const goal =
    Number(document.getElementById("goalLevel").value);

  const current =
    Number(document.getElementById("currentLevel").value);

  const remainingHours =
    Number(document.getElementById("remainingHours").value);

  if (!name || !reward || !goal) {
    alert("Enter the offer name, reward and goal.");
    return;
  }

  offers.push({
    name,
    reward,
    goal,
    current,
    remainingHours
  });

  save();

  document.getElementById("offerName").value = "";
  document.getElementById("offerReward").value = "";
  document.getElementById("goalLevel").value = "";
  document.getElementById("currentLevel").value = "";
  document.getElementById("remainingHours").value = "";

  updateDashboard();
}

function renderHistory() {

  const container =
    document.getElementById("history");

  if (earnings.length === 0) {
    container.innerHTML =
      '<div class="empty">No earnings recorded yet.</div>';
    return;
  }

  container.innerHTML = earnings
    .slice()
    .reverse()
    .map(item => {

      const rate =
        item.hours > 0
          ? item.amount / item.hours
          : 0;

      return `
        <div class="offer">
          <div class="offer-top">
            <div>
              <div class="offer-name">
                ${item.hustle}
              </div>

              <div class="small">
                ${item.date}
              </div>
            </div>

            <div class="offer-rate">
              ${money(item.amount)}
            </div>
          </div>

          <div class="small">
            ${item.hours.toFixed(1)} hours ·
            ${money(rate)}/hr
          </div>
        </div>
      `;

    })
    .join("");
}

function renderOffers() {

  const container =
    document.getElementById("offers");

  if (offers.length === 0) {

    container.innerHTML =
      '<div class="empty">No active offers yet.</div>';

    return;
  }

  container.innerHTML = offers
    .map((offer, index) => {

      const percent =
        Math.min(
          100,
          Math.max(
            0,
            (offer.current / offer.goal) * 100
          )
        );

      const remaining =
        Math.max(
          0,
          offer.goal - offer.current
        );

      const remainingValue =
        offer.reward *
        (remaining / offer.goal);

      const remainingRate =
        offer.remainingHours > 0
          ? remainingValue / offer.remainingHours
          : 0;

      return `
        <div class="offer">

          <div class="offer-top">

            <div class="offer-name">
              ${offer.name}
            </div>

            <div class="offer-rate">
              ${money(offer.reward)}
            </div>

          </div>

          <div class="progress">

            <div
              class="progress-bar"
              style="width:${percent}%">
            </div>

          </div>

          <div class="small">
            ${offer.current} / ${offer.goal}
            · ${percent.toFixed(1)}% complete
          </div>

          <div class="small">
            ${remaining} levels remaining
          </div>

          <div class="small">
            Estimated remaining value:
            ${money(remainingValue)}
          </div>

          <div class="small">
            Remaining potential:
            ${money(remainingRate)}/hr
          </div>

        </div>
      `;

    })
    .join("");
}

function clearData() {

  if (
    confirm(
      "Delete all HustleTrack data?"
    )
  ) {

    earnings = [];
    offers = [];

    localStorage.removeItem("hustleEarnings");
    localStorage.removeItem("hustleOffers");

    updateDashboard();
  }
}

updateDashboard();
calculateRate();

</script>

</body>
</html>
